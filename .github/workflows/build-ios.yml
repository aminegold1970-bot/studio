name: Build unsigned iOS IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json
            NuGet.config

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Verify .NET SDK
        run: dotnet --info

      - name: Install .NET iOS workload
        run: dotnet workload install maui-ios --version 10.0.401

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Verify Apple toolchain
        run: xcodebuild -version

      - name: Clean generated NuGet assets
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            AssetStudio \
            AssetStudio.PInvoke \
            Texture2DDecoderWrapper \
            AssetStudio.Mobile
          do
            if [ -d "$project/obj" ]; then
              rm -rf "$project/obj"
            fi
          done

      - name: Restore AssetStudio dependencies (.NET 6)
        run: |
          dotnet restore AssetStudio/AssetStudio.csproj \
            -p:TargetFramework=net6.0

          dotnet restore AssetStudio.PInvoke/AssetStudio.PInvoke.csproj \
            -p:TargetFramework=net6.0

          dotnet restore Texture2DDecoderWrapper/Texture2DDecoderWrapper.csproj \
            -p:TargetFramework=net6.0

      - name: Restore iOS app and referenced projects
        run: |
          dotnet restore AssetStudio.Mobile/AssetStudioMobile.csproj \
            --runtime ios-arm64 \
            -p:TargetFramework=net10.0-ios

      - name: Verify restored targets
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            AssetStudio \
            AssetStudio.PInvoke \
            Texture2DDecoderWrapper
          do
            assets="$project/obj/project.assets.json"

            if [ ! -f "$assets" ]; then
              echo "::error::Missing $assets"
              exit 1
            fi

            if ! grep -q '"net6.0"' "$assets"; then
              echo "::error::$assets does not contain net6.0"
              exit 1
            fi
          done

      - name: Publish unsigned Release app for ARM64
        run: |
          dotnet publish AssetStudio.Mobile/AssetStudioMobile.csproj \
            --configuration Release \
            --framework net10.0-ios \
            --runtime ios-arm64 \
            --no-restore \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:BuildIpa=false \
            --verbosity minimal

      - name: Package unsigned app as IPA
        shell: bash
        run: |
          set -euo pipefail

          app_root="AssetStudio.Mobile/bin/Release/net10.0-ios/ios-arm64"

          app_path="$(find "$app_root" -type d -name '*.app' -prune -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "::error::No ARM64 iOS .app bundle was produced under $app_root"
            exit 1
          fi

          ipa_path="$GITHUB_WORKSPACE/artifacts/AssetStudioMobile-unsigned.ipa"
          staging_root="$(mktemp -d "$RUNNER_TEMP/assetstudio-ipa.XXXXXX")"

          mkdir -p "$staging_root/Payload" "$(dirname "$ipa_path")"

          ditto "$app_path" "$staging_root/Payload/$(basename "$app_path")"

          ditto -c -k --sequesterRsrc --keepParent \
            "$staging_root/Payload" "$ipa_path"

          unzip -tq "$ipa_path"

          if ! unzip -Z1 "$ipa_path" | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'; then
            echo "::error::The generated IPA does not contain a valid app bundle"
            exit 1
          fi

          echo "Created unsigned IPA: $ipa_path"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMobile-unsigned-ipa
          path: artifacts/AssetStudioMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
