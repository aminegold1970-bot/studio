name: Build AssetStudio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetstudio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore AssetStudio
        run: dotnet restore AssetStudio.sln

      - name: Build AssetStudio
        run: dotnet build AssetStudio.sln --configuration Release --no-restore

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-Build
          path: |
            AssetStudio/bin/Release/**
            AssetStudio.PInvoke/bin/Release/**
            Texture2DDecoderWrapper/bin/Release/**
          if-no-files-found: warn
          retention-days: 14
