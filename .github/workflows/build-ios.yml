name: Build AssetStudio Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetstudio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Display SDK information
        run: dotnet --info

      - name: Verify project files
        run: |
          test -f AssetStudio/AssetStudio.csproj
          test -f AssetStudio.PInvoke/AssetStudio.PInvoke.csproj
          test -f Texture2DDecoderWrapper/Texture2DDecoderWrapper.csproj

      - name: Restore AssetStudio Core
        run: |
          dotnet restore AssetStudio/AssetStudio.csproj \
            -p:EnableWindowsTargeting=true

      - name: Build AssetStudio Core
        run: |
          dotnet build AssetStudio/AssetStudio.csproj \
            --configuration Release \
            --no-restore \
            -p:EnableWindowsTargeting=true

      - name: Upload AssetStudio Core
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AssetStudio-Core-macOS
          path: |
            AssetStudio/bin/Release/**
            AssetStudio.PInvoke/bin/Release/**
            Texture2DDecoderWrapper/bin/Release/**
          if-no-files-found: warn
          retention-days: 14
