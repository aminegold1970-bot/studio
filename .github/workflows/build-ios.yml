name: Build unsigned iOS IPA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA as a direct GitHub Release asset
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_XMLDOC_MODE: skip
      # Keep in sync with sdk.workloadVersion in global.json.
      IOS_WORKLOAD_SET: 10.0.401
      # The symlink /Applications/Xcode.app breaks .NET's actool SDK lookup on
      # macos-26 runners, so always switch to the physical Xcode 26.6 bundle.
      IOS_XCODE_PATH: /Applications/Xcode_26.6.app
      APP_PROJECT: AssetStudio.Mobile/AssetStudioMobile.csproj
      TARGET_FRAMEWORK: net10.0-ios
      RUNTIME_IDENTIFIER: ios-arm64
      PUBLISH_DIR: AssetStudio.Mobile/bin/Release/net10.0-ios/ios-arm64/publish

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET environment
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --info

      - name: Install pinned iOS workload
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install maui-ios
          workload_output="$(dotnet workload --version)"
          installed=""
          if [[ "$workload_output" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            installed="${BASH_REMATCH[1]}"
          fi
          echo "Installed workload set: $installed"
          if [[ "$installed" != "$IOS_WORKLOAD_SET" ]]; then
            echo "::error::Expected workload set $IOS_WORKLOAD_SET, found '$installed'"
            exit 1
          fi

      - name: Select physical Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          unset XCODE_DEVELOPER_DIR_PATH || true
          if [[ ! -d "$IOS_XCODE_PATH/Contents/Developer" ]]; then
            echo "::error::Xcode not found at $IOS_XCODE_PATH"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          xcode_path="$(cd "$IOS_XCODE_PATH" && pwd -P)"
          developer_dir="$xcode_path/Contents/Developer"
          sudo xcode-select --switch "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "IOS_DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "Using Xcode: $xcode_path"
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version

      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          unset XCODE_DEVELOPER_DIR_PATH || true

          xcode_output="$(xcodebuild -version)"
          xcode_version="${xcode_output%%$'\n'*}"
          echo "Xcode: $xcode_version"
          if [[ "$xcode_version" != "Xcode 26.6" ]]; then
            echo "::error::Expected Xcode 26.6, found '$xcode_version'"
            exit 1
          fi

          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $ios_sdk"
          if [[ "$ios_sdk" != 26.5* ]]; then
            echo "::error::Expected iOS SDK 26.5.x, found '$ios_sdk'"
            exit 1
          fi

          # Do not hard-code the SDK directory name. Xcode 26.6 ships
          # MacOSX.sdk as a symlink to MacOSX26.5.sdk; both must pass.
          macos_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "macOS SDK: $macos_sdk"
          case "$macos_sdk" in
            "$IOS_DEVELOPER_DIR"/Platforms/MacOSX.platform/Developer/SDKs/*) ;;
            *)
              echo "::error::macOS SDK is outside the selected Xcode: $macos_sdk"
              exit 1
              ;;
          esac

          actool_path="$(xcrun --find actool)"
          echo "actool: $actool_path"
          case "$actool_path" in
            "$IOS_DEVELOPER_DIR"/*) ;;
            *)
              echo "::error::actool is outside the selected Xcode: $actool_path"
              exit 1
              ;;
          esac

      - name: Clean build outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AssetStudio.Mobile/bin AssetStudio.Mobile/obj artifacts

      - name: Restore iOS app and referenced projects
        shell: bash
        run: |
          set -euo pipefail
          # Restore only the app here. Passing -p:TargetFramework to the whole
          # graph would overwrite the net6.0 assets of the library projects.
          dotnet restore "$APP_PROJECT" \
            --runtime "$RUNTIME_IDENTIFIER" \
            -p:TargetFramework="$TARGET_FRAMEWORK" \
            -p:NuGetAudit=false \
            --no-dependencies \
            -v:minimal
          for project in \
            AssetStudio/AssetStudio.csproj \
            AssetStudio.PInvoke/AssetStudio.PInvoke.csproj \
            Texture2DDecoderWrapper/Texture2DDecoderWrapper.csproj; do
            dotnet restore "$project" -p:NuGetAudit=false -v:minimal
          done

      - name: Publish unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish "$APP_PROJECT" \
            --configuration Release \
            --framework "$TARGET_FRAMEWORK" \
            --runtime "$RUNTIME_IDENTIFIER" \
            --no-restore \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false \
            -p:BuildIpa=false \
            -p:MtouchUseLlvm=false \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:NuGetAudit=false \
            -v:normal

      - name: Locate unsigned .app
        shell: bash
        run: |
          set -euo pipefail
          app_path=""
          for root in \
            "$PUBLISH_DIR" \
            "AssetStudio.Mobile/bin/Release/$TARGET_FRAMEWORK/$RUNTIME_IDENTIFIER" \
            "AssetStudio.Mobile/bin"; do
            if [[ -d "$root" ]]; then
              app_path="$(find "$root" -type d -name '*.app' -prune -print -quit 2>/dev/null || true)"
              if [[ -n "$app_path" ]]; then
                break
              fi
            fi
          done
          if [[ -z "$app_path" ]]; then
            echo "::error::No .app bundle was produced"
            find AssetStudio.Mobile/bin -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi
          if [[ "$app_path" == *iossimulator* ]]; then
            echo "::error::Simulator app found instead of device app: $app_path"
            exit 1
          fi
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
          echo "Found app: $app_path"

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$APP_PATH"
          ipa_path="$GITHUB_WORKSPACE/artifacts/AssetStudioMobile-unsigned.ipa"
          stage="$(mktemp -d "$RUNNER_TEMP/unsigned-ipa.XXXXXX")"
          app_name="$(basename "$app_path")"

          mkdir -p "$stage/Payload" "$(dirname "$ipa_path")"
          ditto "$app_path" "$stage/Payload/$app_name"

          find "$stage/Payload" -type f -name 'embedded.mobileprovision' -exec rm -f {} +
          find "$stage/Payload" -type d -name '_CodeSignature' -prune -exec rm -rf {} +

          if find "$stage/Payload" \( -name '_CodeSignature' -o -name 'embedded.mobileprovision' \) -print -quit | grep -q .; then
            echo "::error::Signing material remains in the IPA payload"
            exit 1
          fi

          # MAUI's template assets are unused by this app. The project no
          # longer copies them, but remove leftovers from the staged payload
          # so the shipped IPA stays clean even if a later template update
          # reintroduces them.
          payload="$stage/Payload/$app_name"
          shopt -s nullglob
          for asset in "$payload"/dotnet_bot*.png "$payload"/AboutAssets.txt; do
            echo "Removing unused asset: $(basename "$asset")"
            rm -f "$asset"
          done
          for dir in "$payload"/*/; do
            name="$(basename "$dir")"
            case "$name" in
              ar|ca|cs|da|de|el|es|fi|fr|he|hi|hr|hu|id|it|ja|ko|ms|nb|nl|pl|pt|pt-BR|ro|ru|sk|sv|th|tr|uk|vi|zh-Hans|zh-Hant|zh-HK)
                echo "Removing localized satellite resources: $name"
                rm -rf "$dir"
                ;;
            esac
          done
          shopt -u nullglob

          if compgen -G "$payload/dotnet_bot*.png" > /dev/null || [[ -e "$payload/AboutAssets.txt" ]]; then
            echo "::error::Unused template assets remain in the IPA payload"
            exit 1
          fi

          # Managed assemblies must stay in the bundle root for Mono AOT, so
          # report the layout instead of moving them into an unsupported folder.
          root_files=("$payload"/*)
          root_dirs=("$payload"/*/)
          root_dlls=("$payload"/*.dll)
          echo "Payload root: ${#root_files[@]} entries, ${#root_dlls[@]} assemblies, ${#root_dirs[@]} folders"

          info="$stage/Payload/$app_name/Info.plist"
          plutil -lint "$info"

          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$info")"
          echo "CFBundleIdentifier: $bundle_id"
          if [[ "$bundle_id" != "com.assetstudio.mobile" ]]; then
            echo "::error::Unexpected bundle identifier: '$bundle_id'"
            exit 1
          fi

          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            value="$(plutil -extract "$key" raw -o - "$info")"
            echo "$key: $value"
            if [[ "$value" != "1" && "$value" != "true" ]]; then
              echo "::error::$key must be true"
              exit 1
            fi
          done

          for key in CFBundleShortVersionString CFBundleVersion UILaunchStoryboardName; do
            value="$(plutil -extract "$key" raw -o - "$info" || true)"
            if [[ -z "$value" ]]; then
              echo "::error::Missing Info.plist key: $key"
              exit 1
            fi
            echo "$key: $value"
          done

          exe_name="$(plutil -extract CFBundleExecutable raw -o - "$info")"
          exe="$stage/Payload/$app_name/$exe_name"
          if [[ ! -f "$exe" ]]; then
            echo "::error::Missing executable: $exe"
            exit 1
          fi
          lipo -info "$exe"

          ditto -c -k --sequesterRsrc --keepParent "$stage/Payload" "$ipa_path"
          unzip -tq "$ipa_path"
          unzip -Z1 "$ipa_path" > "$stage/entries.txt"
          if ! grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$stage/entries.txt"; then
            echo "::error::Invalid IPA structure"
            exit 1
          fi
          if ! grep -q 'Texture2DDecoderNative.framework/Texture2DDecoderNative$' "$stage/entries.txt"; then
            echo "::error::Texture2DDecoderNative.framework is missing from the IPA"
            exit 1
          fi
          shasum -a 256 "$ipa_path"
          ls -lh "$ipa_path"
          echo "Created: $ipa_path"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMobile-unsigned.ipa
          path: artifacts/AssetStudioMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # GitHub Actions artifacts are always downloaded as ZIP archives. Publishing
      # a Release asset is the supported way to expose the .ipa itself as a direct
      # download. Every successful push/manual build updates one stable release.
      - name: Publish direct IPA download
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: artifacts/AssetStudioMobile-unsigned.ipa
          TAG_NAME: ios-unsigned-latest
        run: |
          set -euo pipefail
          title="AssetStudio Mobile unsigned IPA (latest)"
          notes="Unsigned iOS device IPA from the latest successful build. Install requires signing with your own certificate/profile or sideloading tools."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$title" --notes "$notes" --prerelease=false
            gh release upload "$TAG_NAME" "$IPA_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$IPA_PATH" \
              --title "$title" \
              --notes "$notes"
          fi
          echo "### Direct IPA download" >> "$GITHUB_STEP_SUMMARY"
          echo "[AssetStudioMobile-unsigned.ipa](https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/AssetStudioMobile-unsigned.ipa)" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable URL: https://github.com/${{ github.repository }}/releases/latest/download/AssetStudioMobile-unsigned.ipa" >> "$GITHUB_STEP_SUMMARY"
